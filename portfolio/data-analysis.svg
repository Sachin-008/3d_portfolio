<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title description">
  <title id="title">Data analysis dashboard</title>
  <desc id="description">A dataset table beside summary metrics, a bar chart, and a trend line chart.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10233f"/>
      <stop offset="1" stop-color="#172f50"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#52d6c5"/>
      <stop offset="1" stop-color="#61a9ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#background)"/>
  <circle cx="1060" cy="80" r="220" fill="#43c8bb" opacity=".08"/>
  <circle cx="160" cy="570" r="260" fill="#619cff" opacity=".07"/>

  <rect x="70" y="70" width="1060" height="460" rx="26" fill="#0b1729" stroke="#42617d" stroke-width="2"/>
  <rect x="70" y="70" width="1060" height="58" rx="26" fill="#1c3049"/>
  <path d="M70 102h1060v26H70z" fill="#1c3049"/>
  <circle cx="105" cy="99" r="8" fill="#ff7b7b"/>
  <circle cx="133" cy="99" r="8" fill="#ffd166"/>
  <circle cx="161" cy="99" r="8" fill="#52d6c5"/>
  <text x="205" y="107" fill="#e8f2ff" font-family="Arial,sans-serif" font-size="20" font-weight="700">DATA WORKSPACE</text>

  <rect x="104" y="160" width="410" height="322" rx="16" fill="#13243a" stroke="#2e4762"/>
  <text x="132" y="201" fill="#e8f2ff" font-family="Arial,sans-serif" font-size="19" font-weight="700">CLEANED DATASET</text>
  <text x="132" y="237" fill="#88a3bf" font-family="Arial,sans-serif" font-size="14">STUDENT</text>
  <text x="276" y="237" fill="#88a3bf" font-family="Arial,sans-serif" font-size="14">SCORE</text>
  <text x="390" y="237" fill="#88a3bf" font-family="Arial,sans-serif" font-size="14">STATUS</text>
  <path d="M132 251h354M132 294h354M132 337h354M132 380h354M132 423h354" stroke="#2a415a" stroke-width="2"/>
  <g fill="#d3e2f2" font-family="Arial,sans-serif" font-size="16">
    <text x="132" y="279">Alex</text><text x="276" y="279">92</text>
    <text x="132" y="322">Jordan</text><text x="276" y="322">84</text>
    <text x="132" y="365">Taylor</text><text x="276" y="365">78</text>
    <text x="132" y="408">Morgan</text><text x="276" y="408">95</text>
  </g>
  <g fill="#52d6c5" font-family="Arial,sans-serif" font-size="14" font-weight="700">
    <text x="390" y="279">PASS</text><text x="390" y="322">PASS</text>
    <text x="390" y="365">PASS</text><text x="390" y="408">PASS</text>
  </g>

  <rect x="540" y="160" width="556" height="132" rx="16" fill="#13243a" stroke="#2e4762"/>
  <text x="570" y="199" fill="#88a3bf" font-family="Arial,sans-serif" font-size="15" font-weight="700">AVERAGE SCORE</text>
  <text x="570" y="254" fill="#f1f7ff" font-family="Arial,sans-serif" font-size="46" font-weight="700">87.3</text>
  <rect x="802" y="181" width="1" height="90" fill="#2e4762"/>
  <text x="832" y="199" fill="#88a3bf" font-family="Arial,sans-serif" font-size="15" font-weight="700">ROWS ANALYZED</text>
  <text x="832" y="254" fill="#f1f7ff" font-family="Arial,sans-serif" font-size="46" font-weight="700">1,248</text>

  <rect x="540" y="312" width="260" height="170" rx="16" fill="#13243a" stroke="#2e4762"/>
  <text x="564" y="346" fill="#e8f2ff" font-family="Arial,sans-serif" font-size="16" font-weight="700">SCORE DISTRIBUTION</text>
  <path d="M570 452h202M570 417h202M570 382h202" stroke="#2a415a" stroke-width="1"/>
  <rect x="588" y="407" width="25" height="45" rx="5" fill="#52d6c5"/>
  <rect x="630" y="386" width="25" height="66" rx="5" fill="#52d6c5" opacity=".85"/>
  <rect x="672" y="369" width="25" height="83" rx="5" fill="url(#accent)"/>
  <rect x="714" y="393" width="25" height="59" rx="5" fill="#61a9ff" opacity=".8"/>

  <rect x="818" y="312" width="278" height="170" rx="16" fill="#13243a" stroke="#2e4762"/>
  <text x="842" y="346" fill="#e8f2ff" font-family="Arial,sans-serif" font-size="16" font-weight="700">PERFORMANCE TREND</text>
  <path d="M850 450l48-29 47 11 49-48 48 16 44-45" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#52d6c5" stroke="#13243a" stroke-width="3">
    <circle cx="850" cy="450" r="6"/><circle cx="898" cy="421" r="6"/>
    <circle cx="945" cy="432" r="6"/><circle cx="994" cy="384" r="6"/>
    <circle cx="1042" cy="400" r="6"/><circle cx="1086" cy="355" r="6"/>
  </g>
</svg>
