    <circle cx="316" cy="434" r="7"/><circle cx="392" cy="382" r="7"/>
    <circle cx="468" cy="400" r="7"/><circle cx="544" cy="353" r="7"/>
    <circle cx="620" cy="365" r="7"/>
  </g>
