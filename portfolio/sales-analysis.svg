  <text x="997" y="215" fill="#83e1a8" font-family="Arial,sans-serif" font-size="15" font-weight="700">+12.8%</text>

  <rect x="104" y="288" width="604" height="204" rx="16" fill="#261e38" stroke="#473756"/>
  <text x="132" y="326" fill="#fff1e7" font-family="Arial,sans-serif" font-size="17" font-weight="700">MONTHLY REVENUE</text>
