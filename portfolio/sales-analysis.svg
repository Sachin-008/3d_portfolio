<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title description">
  <title id="title">Sales data analysis dashboard</title>
  <desc id="description">A sales dashboard with monthly revenue, product comparisons, and regional sales performance.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#24173f"/>
      <stop offset="1" stop-color="#38214f"/>
    </linearGradient>
    <linearGradient id="sales" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb454"/>
      <stop offset="1" stop-color="#ff6f91"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#background)"/>
  <circle cx="1050" cy="80" r="230" fill="#ff9d64" opacity=".09"/>
  <circle cx="110" cy="550" r="260" fill="#b56cff" opacity=".08"/>

  <rect x="70" y="70" width="1060" height="460" rx="26" fill="#171329" stroke="#5b456c" stroke-width="2"/>
  <rect x="70" y="70" width="1060" height="58" rx="26" fill="#302346"/>
  <path d="M70 102h1060v26H70z" fill="#302346"/>
  <circle cx="105" cy="99" r="8" fill="#ff7b7b"/>
  <circle cx="133" cy="99" r="8" fill="#ffd166"/>
  <circle cx="161" cy="99" r="8" fill="#71d6a3"/>
