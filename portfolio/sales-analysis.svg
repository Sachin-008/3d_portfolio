    <path d="M148 364h526M148 400h526M148 436h526M148 472h526"/>
  </g>
  <path d="M164 451l76-30 76 13 76-52 76 18 76-47 76 12" fill="none" stroke="url(#sales)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#ff9c71" stroke="#261e38" stroke-width="3">
