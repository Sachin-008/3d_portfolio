    <text x="756" y="443">West</text><text x="756" y="481">East</text>
  </g>
  <g>
    <rect x="835" y="350" width="158" height="19" rx="9" fill="#493957"/>
    <rect x="835" y="350" width="135" height="19" rx="9" fill="url(#sales)"/>
    <rect x="835" y="388" width="158" height="19" rx="9" fill="#493957"/>
    <rect x="835" y="388" width="111" height="19" rx="9" fill="#d67ac2"/>
    <rect x="835" y="426" width="158" height="19" rx="9" fill="#493957"/>
    <rect x="835" y="426" width="94" height="19" rx="9" fill="#b779dc"/>
    <rect x="835" y="464" width="158" height="19" rx="9" fill="#493957"/>
    <rect x="835" y="464" width="76" height="19" rx="9" fill="#8d82df"/>
