  <g fill="#e8dced" font-family="Arial,sans-serif" font-size="13" font-weight="700">
    <text x="1007" y="366">38%</text><text x="1007" y="404">29%</text>
    <text x="1007" y="442">22%</text><text x="1007" y="480">18%</text>
