  <rect x="934" y="84" width="160" height="30" rx="15" fill="#493557"/>
  <text x="968" y="105" fill="#f6d6c3" font-family="Arial,sans-serif" font-size="13" font-weight="700">YEAR TO DATE</text>

  <rect x="104" y="158" width="992" height="110" rx="16" fill="#261e38" stroke="#473756"/>
  <text x="132" y="195" fill="#b4a1c5" font-family="Arial,sans-serif" font-size="15" font-weight="700">TOTAL REVENUE</text>
  <text x="132" y="244" fill="#fff7f0" font-family="Arial,sans-serif" font-size="42" font-weight="700">$284,650</text>
  <rect x="440" y="180" width="1" height="68" fill="#4a3958"/>
  <text x="470" y="195" fill="#b4a1c5" font-family="Arial,sans-serif" font-size="15" font-weight="700">UNITS SOLD</text>
  <text x="470" y="244" fill="#fff7f0" font-family="Arial,sans-serif" font-size="38" font-weight="700">8,492</text>
  <rect x="718" y="180" width="1" height="68" fill="#4a3958"/>
  <text x="748" y="195" fill="#b4a1c5" font-family="Arial,sans-serif" font-size="15" font-weight="700">TOP CATEGORY</text>
  <text x="748" y="239" fill="#fff7f0" font-family="Arial,sans-serif" font-size="29" font-weight="700">Electronics</text>
